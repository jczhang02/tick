[package]
name = "tick-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
atspi = { version = "0.30", default-features = false, features = ["proxies", "tokio"] }
libc = "0.2.191"
serde = "1.0.229"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
zbus = { version = "5", features = ["tokio"] }

[dev-dependencies]
png = "0.17"
tick-core = { path = "../tick-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
tick-fake-server = { path = "../tick-fake-server" }
