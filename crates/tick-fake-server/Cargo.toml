[package]
name = "tick-fake-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "tick-fake-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["form", "json", "query", "tokio", "http1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "process", "signal"] }
http-body = "1"
